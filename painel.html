<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Catálogo Melissa (GitHub Pages)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> 
        body { background-color: #f4f6f9; padding: 2rem; } 
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">⚙️ Painel de Controle (Modo Estático)</h2>

        <div class="row mb-4">
            <div class="col-12">
                <div class="alert alert-warning shadow-sm" role="alert">
                    <h5 class="alert-heading">📊 Estatísticas e GA4</h5>
                    <p class="mb-0">Para medir os cliques no WhatsApp, recomendamos colar o script do <b>Google Analytics (GA4)</b> no arquivo index.html.</p>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm p-4">
                    <h4>Adicionar Produto</h4>
                    <form id="formProduto">
                        <div class="mb-2">
                            <label>Nome e Cor</label>
                            <input type="text" id="title" class="form-control" placeholder="Ex: Melissa Coturno (Bege)" required>
                        </div>
                        <div class="mb-2">
                            <label>Categoria</label>
                            <select id="category" class="form-select" required>
                                <option value="bebe">Mini (17 ao 28)</option>
                                <option value="infantil">Mel (26 ao 33)</option>
                                <option value="adulto">Adulto (33 ao 40)</option>
                            </select>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6">
                                <label>Preço "De"</label>
                                <input type="number" step="0.01" id="oldPrice" class="form-control" placeholder="189.90" required>
                            </div>
                            <div class="col-6">
                                <label>Preço "Por"</label>
                                <input type="number" step="0.01" id="newPrice" class="form-control" placeholder="79.90" required>
                            </div>
                        </div>
                        <div class="mb-2">
                            <label>Tamanhos Disponíveis</label>
                            <input type="text" id="sizes" class="form-control" placeholder="Ex: 35 | 36 | 38" required>
                        </div>
                        <div class="mb-2">
                            <label>Cód. Referência</label>
                            <input type="text" id="reference" class="form-control" placeholder="Ex: 32822" required>
                        </div>
                        <div class="mb-3">
                            <label>Nome do Arquivo (Sem a extensão .jpg/.webp)</label>
                            <input type="text" id="imageFile" class="form-control" placeholder="Ex: 32822-bege" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Adicionar à Lista</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm p-4">
                    <div class="d-flex justify-content-between mb-3 align-items-center">
                        <h4 class="mb-0">Produtos Cadastrados</h4>
                        <button onclick="baixarJSON()" class="btn btn-success fw-bold">⬇️ BAIXAR PRODUTOS.JSON</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-striped align-middle">
                            <thead>
                                <tr>
                                    <th>Foto</th>
                                    <th>Nome</th>
                                    <th>Preço Promo</th>
                                    <th>Ação</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaCorpo"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let catalogo = [];

        fetch('produtos.json')
            .then(res => res.json())
            .then(data => { catalogo = data; atualizarTabela(); })
            .catch(e => console.log('Iniciando catálogo vazio.'));

        document.getElementById('formProduto').addEventListener('submit', function(e) {
            e.preventDefault();
            const novo = {
                id: Date.now(), 
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                priceOriginal: parseFloat(document.getElementById('oldPrice').value),
                pricePromo: parseFloat(document.getElementById('newPrice').value),
                sizes: document.getElementById('sizes').value,
                reference: document.getElementById('reference').value,
                imageFile: document.getElementById('imageFile').value
            };
            catalogo.push(novo);
            atualizarTabela();
            this.reset();
        });

        // O mesmo sistema inteligente aplicado ao Painel
        function handlePanelImageError(img, ref) {
            const currentSrc = img.src;
            if (currentSrc.includes('.webp') && !img.dataset.triedJpg) {
                img.dataset.triedJpg = "true";
                img.src = currentSrc.replace('.webp', '.jpg');
            } else if (currentSrc.includes('.jpg') && !img.dataset.triedPng) {
                img.dataset.triedPng = "true";
                img.src = currentSrc.replace('.jpg', '.png');
            } else if (!img.dataset.triedDefaultWebp) {
                img.dataset.triedDefaultWebp = "true";
                img.src = `img/${ref}.webp`;
            } else if (!img.dataset.triedDefaultJpg) {
                img.dataset.triedDefaultJpg = "true";
                img.src = `img/${ref}.jpg`;
            } else if (!img.dataset.triedDefaultPng) {
                img.dataset.triedDefaultPng = "true";
                img.src = `img/${ref}.png`;
            } else {
                img.src = 'https://via.placeholder.com/40x40?text=Foto';
            }
        }

        function atualizarTabela() {
            const tbody = document.getElementById('tabelaCorpo');
            tbody.innerHTML = '';
            catalogo.forEach(item => {
                const imgFile = item.imageFile || item.reference;
                tbody.innerHTML += `
                    <tr>
                        <td><img src="img/${imgFile}.webp" onerror="handlePanelImageError(this, '${item.reference}')" width="40" height="40" style="object-fit:cover; border-radius:5px;"></td>
                        <td>${item.title}<br><small class="text-muted">${item.category}</small></td>
                        <td>R$ ${item.pricePromo.toFixed(2).replace('.', ',')}</td>
                        <td><button onclick="removerItem(${item.id})" class="btn btn-sm btn-danger">Excluir</button></td>
                    </tr>
                `;
            });
        }

        function removerItem(id) {
            catalogo = catalogo.filter(item => item.id !== id);
            atualizarTabela();
        }

        function baixarJSON() {
            if(catalogo.length === 0) return alert("Adicione pelo menos 1 produto!");
            
            const limpos = catalogo.map(({id, ...resto}) => resto);
            const dataStr = JSON.stringify(limpos, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "produtos.json";
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
